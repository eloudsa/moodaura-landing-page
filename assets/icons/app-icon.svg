<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="highest-quality-gradient" 
      cx="50%" 
      cy="50%" 
      r="50%" 
      gradientUnits="userSpaceOnUse" 
      spreadMethod="pad">
      <!-- Core purple with smooth transition -->
      <stop offset="0%" stop-color="#5D2A8C" stop-opacity="1"/>
      <stop offset="20%" stop-color="#662E9B" stop-opacity="1"/>
      <stop offset="35%" stop-color="#5B4B8A" stop-opacity="1"/>
      <!-- Middle transition through turquoise -->
      <stop offset="50%" stop-color="#43BCCD" stop-opacity="1"/>
      <stop offset="65%" stop-color="#65D4B1" stop-opacity="1"/>
      <!-- Outer transition to yellow -->
      <stop offset="80%" stop-color="#92E6A7" stop-opacity="1"/>
      <stop offset="90%" stop-color="#D6F5A0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F9F871" stop-opacity="1"/>
    </radialGradient>
  </defs>
  
  <!-- Perfect circle with crisp vector path -->
  <circle 
    cx="512" 
    cy="512" 
    r="492" 
    fill="url(#highest-quality-gradient)"
    shape-rendering="geometricPrecision"/>
</svg>
