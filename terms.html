<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoodAura – Terms of Use</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<main class="legal-container">
  <div id="content-area">Loading...</div>
</main>

<script>
  // Detect language from query param or fallback to 'en'
  const lang = new URLSearchParams(window.location.search).get('lang') || 'en';
  const file = `assets/legal/terms-of-use-${lang}.md`;

  fetch(file)
    .then(res => {
      if (!res.ok) throw new Error("File not found");
      return res.text();
    })
    .then(md => {
      document.getElementById('content-area').innerHTML = marked.parse(md);
    })
    .catch(() => {
      document.getElementById('content-area').innerHTML = `<p>Unable to load privacy policy in the selected language.</p>`;
    });
</script>
</body>
</html>
